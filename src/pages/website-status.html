<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script defer src="https://cloud.umami.is/script.js" data-website-id="4a56b2a6-010f-412d-b1ae-59417d30a68d"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2f5d50">
    <meta name="description" content="教师工具箱网站状态">
    <title>网站状态 - 教师工具箱</title>
    <link rel="stylesheet" href="../css/styles.css?v=2.2.0">
    <link rel="manifest" href="../../manifest.json">
    <link rel="icon" href="../../assets/images/briefcase-192x192.png" type="image/png">
    <link rel="apple-touch-icon" href="../../assets/images/briefcase-192x192.png">
    <style>
        .status-container {
            max-width: 720px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .status-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .status-header h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        .back-btn {
            background: var(--primary-color, #2f5d50);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
        }

        /* ── 状态卡片 ──────────────────────────── */

        .status-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            padding: 1.5rem;
            border: 1px solid rgba(0, 0, 0, 0.06);
            margin-bottom: 1rem;
        }

        .status-top {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.35rem 0.9rem;
            border-radius: 999px;
            color: #fff;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .status-badge::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            background: rgba(255,255,255,0.7);
        }
        .status-badge.loading { background: #64748b; }
        .status-badge.online  { background: #16a34a; }
        .status-badge.online::before  { animation: pulse-dot 2s infinite; }
        .status-badge.offline { background: #dc2626; }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .status-meta {
            color: #64748b;
            font-size: 0.85rem;
        }

        .status-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #0f172a;
            margin: 0 0 0.3rem 0;
        }

        .status-sub {
            color: #475569;
            font-size: 0.95rem;
            margin: 0;
        }

        /* ── 指标网格 ──────────────────────────── */

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.8rem;
            margin: 1rem 0;
        }

        .metric-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 0.75rem;
            text-align: center;
        }

        .metric-label {
            display: block;
            font-size: 0.78rem;
            color: #64748b;
            margin-bottom: 0.2rem;
        }

        .metric-val {
            display: block;
            font-size: 1.2rem;
            font-weight: 700;
            color: #0f172a;
        }

        /* ── 心跳图表 ──────────────────────────── */

        .chart-section h3 {
            margin: 0 0 0.6rem 0;
            font-size: 0.95rem;
            color: #334155;
        }

        .hb-bars {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 90px;
            padding: 4px 0;
        }

        .hb-bar-wrap {
            flex: 1;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            height: 100%;
        }

        .hb-bar {
            width: 100%;
            min-width: 4px;
            border-radius: 3px 3px 0 0;
            transition: height 0.3s;
        }

        /* ── Ping 统计 ──────────────────────────── */

        .ping-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.6rem;
        }

        .ping-item {
            text-align: center;
        }

        .ping-label {
            display: block;
            font-size: 0.75rem;
            color: #64748b;
            margin-bottom: 0.15rem;
        }

        .ping-value {
            display: block;
            font-size: 1rem;
            font-weight: 600;
            color: #0f172a;
        }

        /* ── 操作 ──────────────────────────────── */

        .actions {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .btn-refresh {
            background: var(--primary-color, #2f5d50);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-refresh:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auto-note {
            color: #94a3b8;
            font-size: 0.82rem;
        }

        /* ── 深色模式 ──────────────────────────── */

        body.dark-mode .status-card {
            background: #1e293b;
            border-color: rgba(255, 255, 255, 0.06);
        }

        body.dark-mode .status-title { color: #e2e8f0; }
        body.dark-mode .status-sub   { color: #94a3b8; }
        body.dark-mode .status-meta  { color: #94a3b8; }

        body.dark-mode .metric-box {
            background: #0f172a;
            border-color: #334155;
        }
        body.dark-mode .metric-val   { color: #e2e8f0; }
        body.dark-mode .metric-label { color: #94a3b8; }

        body.dark-mode .chart-section h3 { color: #cbd5e1; }
        body.dark-mode .ping-label  { color: #94a3b8; }
        body.dark-mode .ping-value  { color: #e2e8f0; }

        /* ── 响应式 ──────────────────────────────── */

        @media (max-width: 640px) {
            .status-container { padding: 0 1rem; }
            .metric-grid { grid-template-columns: repeat(2, 1fr); }
            .ping-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <header>
        <div class="status-header" style="max-width:720px;margin:0 auto;padding:0 1.5rem;">
            <a class="back-btn" href="../../index.html">← 返回主页</a>
            <h1>网站状态</h1>
            <div style="width:80px;"></div>
        </div>
    </header>

    <div class="status-container">
        <div class="status-card">
            <div class="status-top">
                <span id="statusBadge" class="status-badge loading">检测中</span>
                <span id="lastChecked" class="status-meta">最后检测：--</span>
            </div>

            <p id="statusMessage" class="status-title">正在获取状态...</p>
            <p class="status-sub">数据来自 Uptime Kuma 监控，每 30 秒自动刷新</p>

            <div class="metric-grid">
                <div class="metric-box">
                    <span class="metric-label">运行状态</span>
                    <span id="uptimeValue" class="metric-val">--</span>
                </div>
                <div class="metric-box">
                    <span class="metric-label">响应延迟</span>
                    <span id="pingValue" class="metric-val">--</span>
                </div>
            </div>

            <div class="chart-section">
                <h3>最近心跳（30 次）</h3>
                <div id="heartbeatChart" class="hb-bars" style="display:flex;align-items:center;justify-content:center;height:90px;">
                    <span style="color:#94a3b8;">加载中...</span>
                </div>
            </div>

            <div id="pingStats" style="margin-top:0.8rem;"></div>

            <div class="actions">
                <button id="refreshBtn" class="btn-refresh" type="button">立即刷新</button>
                <span class="auto-note">每 30 秒自动刷新</span>
            </div>
        </div>
    </div>

    <script defer src="../js/website-status.js?v=2.1.0"></script>
</body>
</html>
